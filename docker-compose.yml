name: fintech-platform

services:
  # ======================= Auth Service =======================
  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME}
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER} -d ${AUTH_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  auth-service:
    image: ${AUTH_SERVICE_IMAGE:-auth-service:latest}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/${AUTH_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD}
      APPLICATION_CLIENT_USER_SERVICE_URL: http://user-service:8081
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-900000}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-604800000}
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      auth-db:
        condition: service_healthy
    networks: [backend]

  user-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB_USER} -d ${USER_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  user-redis:
    image: redis:7
    networks: [backend]

  user-service:
    image: ${USER_SERVICE_IMAGE:-user-service:latest}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/${USER_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${USER_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: user-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-service:8082/.well-known/jwks.json
    depends_on:
      user-db:
        condition: service_healthy
      user-redis:
        condition: service_started
    networks: [backend]

  order-db:
    image: postgres:16
    profiles: ["order"]
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME}
      POSTGRES_USER: ${ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDER_DB_USER} -d ${ORDER_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  order-redis:
    image: redis:7
    profiles: ["order"]
    networks: [backend]

  order-service:
    image: ${ORDER_SERVICE_IMAGE:-order-service:latest}
    profiles: ["order"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/${ORDER_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${ORDER_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${ORDER_DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: order-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth-service:8082/.well-known/jwks.json
      # адрес User Service для Feign/WebClient: добавить переменную под имя свойства, значение http://user-service:8081
    depends_on:
      order-db:
        condition: service_healthy
      order-redis:
        condition: service_started
    networks: [backend]

  api-gateway:
    image: ${API_GATEWAY_IMAGE:-api-gateway:latest}
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8082
      USER_SERVICE_URL: http://user-service:8081
      ORDER_SERVICE_URL: http://order-service:8083
      JWK_SET_URI: http://auth-service:8082/.well-known/jwks.json
    depends_on:
      - auth-service
      - user-service
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  auth_db_data:
  user_db_data:
  order_db_data: